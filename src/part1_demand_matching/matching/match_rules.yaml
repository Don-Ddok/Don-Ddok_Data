# 매칭 모델 3단계 규칙 (matcher.py가 읽음). 코드에는 규칙을 두지 않는다.
# 페르소나 키: A 결제형 / B 차입운영형 / C 설비투자형 / D 현금비축형 / E 요구불중심형 (페르소나 이름의 첫 글자)

segments:
  exposed: [수출형, 수입형]
  none: 비노출
general_stage: 일반            # 비노출 법인의 단계 (수출 둔화 트리거 미적용 — β₁ 반응 근거 없음)

# 2. 단계 × 페르소나 → 모델유형 우선순위. method가 있으면 그 칸의 제안방식(단계 기본값 대신)
#    수출금융/수입금융 중 무엇이 나갈지는 상품표 데이터필터(세그먼트)가 정한다.
stage_persona:
  평시:
    A: {types: [수출금융, 수입금융]}
    B: {types: [한도대출]}
    C: {types: [시설자금]}
    D: {types: [한도대출]}
    E: {types: [운전자금]}
  관찰:
    A: {types: [수출금융, 수입금융], method: 상담 예약}
    B: {types: [한도대출], method: 한도 안내}
    C: {types: [시설자금], method: 상담 예약}
    D: {types: [], method: 연락 보류}
    E: {types: [운전자금], method: 상담 예약}
  적기:
    A: {types: [매출채권유동화, 수출금융, 수입금융, 수출입운전자금]}
    B: {types: [한도대출, 운전자금]}
    C: {types: [운전자금, 한도대출], method: "선제 제안 (+상환 조건 상담)"}
    D: {types: [한도대출]}
    E: {types: [운전자금, 한도대출]}
  정점·유지:
    A: {types: [보증정책연계, 수출입운전자금]}
    B: {types: [보증정책연계, 운전자금]}
    C: {types: [보증정책연계]}
    D: {types: [한도대출]}
    E: {types: [보증정책연계]}
  장기둔화:
    A: {types: [보증정책연계]}
    B: {types: [보증정책연계]}
    C: {types: [보증정책연계]}
    D: {types: [보증정책연계]}
    E: {types: [보증정책연계]}
  일반:
    비노출: {types: [운전자금, 한도대출]}

# 이 제안방식인 칸은 추천하지 않는다 (보조 태그 유형도 붙이지 않음)
hold_methods: [연락 보류]

# 3. 보조 태그 → 후순위 유형 (적힌 순서대로 주 페르소나 유형 뒤에 붙임)
subtag_types:
  - {tag: 보유_A, type: 매출채권유동화}
  - {tag: 보유_C, type: 시설자금}
  - {tag: 보유_B, type: 운전자금}
# 보조 태그 유형을 붙일 수 있는 범위 (단계별)
#   row:  그 단계 행(모든 페르소나 칸)에 나오는 유형이면 붙임
#   cell: 그 법인 페르소나 칸에 나오는 유형만 (이 경우 보조 태그는 새 유형을 추가하지 못함)
subtag_scope:
  평시: cell
  관찰: cell
  적기: row
  정점·유지: row
  장기둔화: row
  일반: cell

# 4. 상품 선택
max_recommendations: 3
# 추천 개수 규칙 (전 단계 공통). '칸 유형 수' = 보조 태그까지 붙인 유형 목록 중 필터를 통과한 후보가 있는 유형 수
#   3개 이상 → 3개, 유형당 1개 / 2개 → 2개, 유형당 1개 / 1개 → 같은 유형 최대 2개
#   칸 밖 유형이나 같은 유형 3번째로 채우지 않는다 (2차 채움 없음)
count_rule:
  per_type_multi: 1            # 칸 유형이 2개 이상일 때 유형당 개수
  single_type_max: 2           # 칸 유형이 1개일 때 그 유형에서 최대 개수
match_sub_type: true           # 모델유형이 같거나, 보조유형이 같은 상품도 그 유형 후보로 본다 (예: 시설자금)
sub_type_after_main: true      # 같은 유형 안에서 모델유형 일치 상품을 먼저, 보조유형으로 들어온 상품은 그 뒤에
# 단계별 예외: 관찰은 보조유형으로 매칭되는 상품(모델유형이 칸 유형과 다른 상품)을 쓰지 않음 → 추천 1~2개
stage_options:
  관찰: {match_sub_type: false}
recommend_order: [Y, 확인필요]  # 같은 유형 안에서 이 순서. 여기에 없는 값(N)은 제외
demote_note_keyword: "오류 의심"   # 비고에 이 말이 있는 상품은 Y라도 확인필요와 같은 순위로 정렬 (표시값은 그대로)
exclude_types: [제외, 보증기관안내]
# 같은 유형 안 기본순위 (같은 법인추천가능 순위 안에서 적용). groups는 위 그룹부터, "*"는 '그 외(상품ID 순)'
product_rank:
  운전자금:
    groups:
      - [기업운전자금대출]
      - [ESG Grow-Up 특별대출]
      - "*"
      - [MP연계기업구매자금대출]
  보증정책연계:
    basis: "지역 연계 우선 (설계)"
    groups:
      - [대구시 추천자금, 경상북도 추천자금]
      - [DGB 희망키움 특별보증 대출, 골목상점가 특별보증 대출]
      # 3) 신보·기보·지역재단 보증서 담보 대출: 상품표에서 보증기관안내(추천 제외)로 분류돼 현재 후보 없음
      - [신용보증기금, 기술신용보증기금, 대구신용보증재단, 경북신용보증재단, 수탁보증, 협약체결 지역신용보증재단]
      - [대구광역시 중소기업육성자금, 경상북도 중소기업육성자금]
      - "*"
      - [소상공인시장진흥공단 정책자금]
      - [국세성실납세 사업자 특별대출]     # 대상 문구 오류 의심
  수출금융:
    basis: "적기 단계 유동성 기여도 순 (설계). 신용장 통지는 업무 서비스라 후순위"
    groups:
      - [수출환 어음매입]
      - [수출환어음 인수 후 매입]
      - [무역금융]
      - [내국신용장 개설]
      - [수출신용장통지]
  수입금융:
    basis: "적기 단계 유동성 기여도 순 (설계). 신용장 통지는 업무 서비스라 후순위"
    groups:
      - [수입물품대도]
      - [수입신용장개설]
      - [수입화물선취보증서]
  # 나머지 유형은 상품ID 오름차순

# 보증정책연계 상품의 이용경로 (보증기관안내 상품명)
usage_path:
  for_type: 보증정책연계
  by_product:                  # 원문 근거가 있는 상품
    "DGB 희망키움 특별보증 대출": 대구신용보증재단   # 상세 페이지 대출조건: 대구신용보증재단 85~100% 보증
    "골목상점가 특별보증 대출": 대구신용보증재단     # 상세 페이지 대출조건: 대구신용보증재단 85~100% 보증
  default_by_region:           # 원문 근거가 없으면 법인 지역의 신용보증재단 (설계값)
    대구: 대구신용보증재단
    경북: 경북신용보증재단

# 5. 이미 보유한 계정 → 제안방식을 '한도·조건 조정'으로
held_adjust:
  method: 한도·조건 조정
  rules:
    - {tag: 보유_A, product_names: [상업어음할인, 무역금융]}
    - {tag: 보유_C, types: [시설자금]}      # 모델유형 또는 보조유형
    - {tag: 보유_B, types: [운전자금]}

# 6. 단계별 기본 제안방식
stage_methods:
  관찰: 상담 예약
  적기: 선제 제안
  정점·유지: 보증 연계·조건 조정
  장기둔화: 보증 연계 (근거 범위 밖)
  평시: 일반 안내
  일반: 일반 안내

# 제안메시지 (단계 × 페르소나 칸마다 한 줄). 전부 초안이며 설계값이다.
# 적기는 팀 초안, 다른 단계는 칸별 제안방식을 한 줄 문구로 옮긴 초안. 빈 문자열이면 메시지 없음.
message_templates:
  basis: "초안 (설계값) — 2026-09-29 조건부 표현으로 수정: 승인·이용 가능을 보장하지 않음"
  평시:
    A: "수출입 결제 금융, 이용 조건을 안내해 드려요"
    B: "지금 쓰시는 운전자금 한도와 조건, 한번 점검해 보세요"
    C: "설비 투자 계획이 있으시면 시설자금 이용 조건을 안내해 드려요"
    D: "예금과 함께 쓸 수 있는 한도대출, 이용 조건을 알아두세요"
    E: "사업 운영자금이 필요할 때를 대비해 이용 조건을 안내해 드려요"
  관찰:
    A: "수출 흐름이 바뀌고 있어요. 결제 일정 점검 상담을 예약해 보세요"
    B: "혹시 모를 자금 수요에 대비해 현재 한도를 확인해 보세요"
    C: "설비 투자 일정, 지금 한번 같이 점검해 보시겠어요?"
    D: ""                        # 연락 보류
    E: "운영자금 상담을 미리 예약해 두시면 필요할 때 빠르게 안내해 드려요"
  적기:
    A: "수출 대금을 먼저 현금화할 수 있는지, 이용 조건을 상담해 보세요"
    B: "운전자금 한도를 늘릴 수 있는지, 미리 조건을 상담해 보세요"
    C: "시설자금 상환 부담을 운전자금으로 나눌 수 있는지 상담해 보세요"
    D: "예금은 그대로 두고 쓸 수 있는 한도대출, 이용 조건을 상담해 보세요"
    E: "기업 대출이 처음이라면 통장 한도대출 이용 조건부터 알아보세요"
  정점·유지:
    A: "보증을 활용한 수출입 자금, 이용 가능 여부와 조건을 상담해 보세요"
    B: "보증 연계 운전자금, 이용 가능 여부와 조건을 상담해 보세요"
    C: "보증·정책자금으로 설비 투자 부담을 나눌 수 있는지 상담해 보세요"
    D: "필요할 때 쓰실 수 있도록 한도 조건 점검을 상담해 보세요"
    E: "지자체·보증 연계 자금, 이용 가능 여부와 조건을 상담해 보세요"
  장기둔화:
    A: "둔화가 길어지고 있어요. 보증·정책자금 이용 가능 여부와 조건을 안내해 드려요"
    B: "둔화가 길어지고 있어요. 보증·정책자금 이용 가능 여부와 조건을 안내해 드려요"
    C: "둔화가 길어지고 있어요. 보증·정책자금 이용 가능 여부와 조건을 안내해 드려요"
    D: "둔화가 길어지고 있어요. 보증·정책자금 이용 가능 여부와 조건을 안내해 드려요"
    E: "둔화가 길어지고 있어요. 보증·정책자금 이용 가능 여부와 조건을 안내해 드려요"
  일반:
    비노출: "사업 운영자금과 통장 한도대출, 이용 조건을 안내해 드려요"
  # 세그먼트별 덮어쓰기: (단계, 페르소나, 세그먼트) → 없으면 위의 (단계, 페르소나) 문구
  segment_overrides:
    평시:
      A: {수입형: "수입 결제 금융, 이용 조건을 안내해 드려요"}
    관찰:
      A: {수입형: "수입 결제 일정 상담을 예약해 두세요"}
    적기:
      A: {수입형: "수입 대금 결제를 미룰 수 있는지, 이용 조건을 상담해 보세요"}
    # 정점·유지, 장기둔화: 덮어쓰기 없음 ("수출입"은 방향 없는 표현)
# 문구 점검: 수입형 문구에 "수출", 수출형 문구에 "수입"이 있으면 오류.
# neutral_words는 점검 전에 지운다 ("수출입"은 방향 없는 표현)
message_check:
  수입형: 수출
  수출형: 수입
  neutral_words: [수출입]

# 7. 근거 표시
# 2026-09-29: '확정' 라벨을 좁힘. 적기·정점·유지는 사전등록 규칙의 결과 (분석결과\민영_β합검정.md)
# 2026-09-30: 디벨롭 검토(outputs\devreview\bundle_f_trigger_replay.py, §6.2)에서 재검정 시 h=2도
# 유의했는데 '반응 전' 라벨을 그대로 쓴 것을 확인 — 문구를 결과와 맞췄다. 단계 구간(k=0~2)은 그대로.
# 사용자 승인(2026-09-30).
timing_basis:
  관찰: "둔화 초기 관찰 구간 (h≤2, 재검정에서 h=2 유의)"
  적기: "요구불 반응 추정 (h=3~6 유의, 상품 효과 아님)"
  정점·유지: "요구불 반응 추정 (h=7~12 유의, 상품 효과 아님)"
  장기둔화: "근거 범위 밖 (h≥13 추정 안 함)"
  평시: "해당없음 (평시)"
  일반: "해당없음 (β₁ 반응 근거 없음)"
product_basis: 설계

# 8. 월별 우선순위 정렬 (가중치 없이 순서 규칙)
# 2026-09-30: 디벨롭 검토(outputs\devreview\bundle_h_ranking.py)에서 사전식 정렬은 잔액이 반올림돼
# 동률이 흔한데도(96%), 정작 상위권(정점·유지 상위 20위)은 반올림 동률이 없어 '최근 변화' 기준이
# 상위권에는 전혀 반영되지 않음을 확인했다. score 방식으로 바꿔 규모·최근 변화를 항상 함께 반영한다.
# 사용자 승인(2026-09-30).
priority:
  stage_order: [적기, 정점·유지, 장기둔화, 관찰, 평시, 일반]
  demand_change_months: 3      # 최근 N개월 요구불 변화 (감소가 클수록 점수에 유리)
  method: score                # score(가중합) | lexicographic(이전 방식, 참고·롤백용)
  weights: {size: 0.7, momentum: 0.3}   # 그룹(연월×단계×노출여부) 안에서 백분위 순위의 가중합. 설계값 — 결과를 보고 조정하지 않는다
  missing_momentum_percentile: 0.5      # 최근 N개월 전 관측이 없어 변화를 모르는 법인의 momentum 백분위(중립)
